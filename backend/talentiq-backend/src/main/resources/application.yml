# ============================================================
# TalentIQ — Application Configuration
# ============================================================
# Active profile is set via environment variable APP_PROFILE
# Defaults to 'dev' if not set.
spring:
  profiles:
    active: ${APP_PROFILE:dev}

  application:
    name: talentiq-backend

  # ── Jackson ──────────────────────────────────────────────
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
      fail-on-empty-beans: false
    deserialization:
      fail-on-unknown-properties: false
    time-zone: UTC

  # ── JPA / Hibernate ───────────────────────────────────────
  jpa:
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true
        default_batch_fetch_size: 25
        in_clause_parameter_padding: true
        jdbc:
          batch_size: 25
        order_inserts: true
        order_updates: true
        connection:
          handling_mode: DELAYED_ACQUISITION_AND_RELEASE_AFTER_TRANSACTION

  # ── Flyway ────────────────────────────────────────────────
  flyway:
    enabled: true
    baseline-on-migrate: true
    validate-on-migrate: false
    out-of-order: true
    locations: classpath:db/migration

  # ── File Upload ───────────────────────────────────────────
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 15MB

  # ── Mail ──────────────────────────────────────────────────
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:hiremindai.ai@gmail.com}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          ssl:
            trust: smtp.gmail.com
            protocols: TLSv1.2 TLSv1.3
        connectiontimeout: 5000
        timeout: 5000
        writetimeout: 5000

  # ── Async & Scheduling Task Executors ──────────────────────
  task:
    execution:
      pool:
        core-size: 5
        max-size: 20
        queue-capacity: 100
        keep-alive: 60s
      thread-name-prefix: talentiq-async-
    scheduling:
      pool:
        size: 5
      thread-name-prefix: talentiq-scheduler-

# ── Server ──────────────────────────────────────────────────
server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /api
  error:
    include-message: always
    include-binding-errors: always
    include-stacktrace: never
    include-exception: false
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/plain
    min-response-size: 1024

# ── Actuator ────────────────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized

# ── Logging ─────────────────────────────────────────────────
logging:
  level:
    com.talentiq: INFO
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"

# ── Application Custom Properties ───────────────────────────
app:
  name: HireMind AI
  version: 1.0.0

  # JWT
  jwt:
    secret: ${JWT_SECRET:talentiq-super-secret-key-change-in-production-must-be-at-least-256-bits}
    access-token-expiry-ms: ${JWT_ACCESS_EXPIRY_MS:900000}       # 15 minutes
    refresh-token-expiry-days: ${JWT_REFRESH_EXPIRY_DAYS:7}      # 7 days

  # CORS
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
    allowed-methods: GET,POST,PUT,PATCH,DELETE,OPTIONS
    allowed-headers: "*"
    allow-credentials: true
    max-age: 3600

  # File Storage
  storage:
    provider: ${STORAGE_PROVIDER:local}     # local | s3
    local:
      base-path: ${STORAGE_LOCAL_PATH:./uploads}
    s3:
      bucket: ${AWS_S3_BUCKET:talentiq-files}
      region: ${AWS_REGION:us-east-1}
      access-key: ${AWS_ACCESS_KEY:}
      secret-key: ${AWS_SECRET_KEY:}
    max-file-size-bytes: 10485760           # 10 MB
    allowed-resume-types: application/pdf,application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document
    allowed-image-types: image/jpeg,image/png,image/webp,image/gif

  # Email
  mail:
    from: ${MAIL_FROM:hiremindai.ai@gmail.com}
    from-name: ${MAIL_FROM_NAME:HireMind AI Platform}
    verification-expiry-minutes: 30
    reset-password-expiry-minutes: 15

  # Frontend URL (for email links)
  frontend:
    base-url: ${FRONTEND_BASE_URL:http://localhost:3000}

  # AI
  ai:
    provider: ${AI_PROVIDER:openai}         # openai | gemini | ollama
    openai:
      api-key: ${OPENAI_API_KEY:}
      model: ${OPENAI_MODEL:gpt-4o}
      embedding-model: ${OPENAI_EMBEDDING_MODEL:text-embedding-3-small}
      max-tokens: 4096
      temperature: 0.7
    gemini:
      api-key: ${GEMINI_API_KEY:}
      model: ${GEMINI_MODEL:gemini-1.5-pro}
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      model: ${OLLAMA_MODEL:llama3.2}
    agents:
      hr-model: ${AI_HR_MODEL:gpt-4o}
      candidate-model: ${AI_CANDIDATE_MODEL:gpt-4o-mini}
      chat-retention-days: ${AI_CHAT_RETENTION_DAYS:90}
      cache-ttl-minutes: ${AI_CACHE_TTL_MINUTES:30}
      training-enabled: ${AI_TRAINING_ENABLED:false}
      max-tokens-per-user-daily: ${AI_MAX_TOKENS_PER_USER_DAILY:50000}
      max-requests-per-minute: ${AI_MAX_REQUESTS_PER_MINUTE:10}

  # Rate Limiting
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    default-capacity: 200
    default-refill-per-minute: 200
    login-capacity: 60
    login-refill-per-minute: 60

  # Admin
  admin:
    default-email: ${ADMIN_EMAIL:admin@talentiq.ai}
    default-password: ${ADMIN_PASSWORD:Admin@123!}

  # Kafka Distributed Message Backbone
  kafka:
    enabled: ${KAFKA_ENABLED:false}
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

  # Payment Gateway
  payment:
    gateway: ${PAYMENT_GATEWAY:mock}    # mock | razorpay
    razorpay:
      key-id: ${RAZORPAY_KEY_ID:}
      key-secret: ${RAZORPAY_KEY_SECRET:}
      webhook-secret: ${RAZORPAY_WEBHOOK_SECRET:}


