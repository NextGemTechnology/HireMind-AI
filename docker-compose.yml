# ============================================================
# TalentIQ — Docker Compose (Development)
# Services: backend, frontend, mysql, redis, adminer
# ============================================================

version: "3.9"

services:

  # ── MySQL ────────────────────────────────────────────────────
  mysql:
    image: mysql:8.4
    container_name: talentiq-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-HireMeAI}
      MYSQL_USER: ${MYSQL_USER:-talentiq_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    command: >
      mysqld
      --innodb-buffer-pool-size=256M
      --innodb-log-file-size=64M
      --innodb-flush-log-at-trx-commit=2
      --max-connections=200
      --slow-query-log=ON
      --long-query-time=1
      --slow-query-log-file=/var/log/mysql/slow-query.log
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - talentiq-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "--password=${MYSQL_ROOT_PASSWORD:-}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ── Redis ─────────────────────────────────────────────────────
  redis:
    image: redis:7.4-alpine
    container_name: talentiq-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    networks:
      - talentiq-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  # ── Backend ───────────────────────────────────────────────────
  backend:
    image: abhaygupta002/talentiq-backend:latest
    build:
      context: ./talentiq-backend
      dockerfile: Dockerfile
    container_name: talentiq-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      APP_PROFILE: dev
      DB_HOST: ${DB_HOST:-mysql}
      DB_PORT: ${DB_PORT:-3306}
      DB_NAME: ${DB_NAME:-HireMeAI}
      DB_USER: ${DB_USER:-talentiq_user}
      DB_PASSWORD: ${MYSQL_PASSWORD:-${DB_PASSWORD:-}}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-in-production-minimum-256-bits}
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://localhost:5173
      FRONTEND_BASE_URL: http://localhost:3000
      STORAGE_PROVIDER: local
      STORAGE_LOCAL_PATH: /app/uploads
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      AI_PROVIDER: ${AI_PROVIDER:-openai}
      MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-hiremindai.ai@gmail.com}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-hiremindai.ai@gmail.com}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-HireMind AI Platform}
    ports:
      - "8081:8080"
    volumes:
      - backend_uploads:/app/uploads
      - backend_logs:/var/log/talentiq
    networks:
      - talentiq-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/api/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ── Frontend ──────────────────────────────────────────────────
  frontend:
    image: abhaygupta002/talentiq-frontend:latest
    build:
      context: ./talentiq-frontend
      dockerfile: Dockerfile
    container_name: talentiq-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      VITE_API_BASE_URL: http://backend:8080/api
      VITE_WS_URL: ws://backend:8080/api/ws
    ports:
      - "3000:80"
    networks:
      - talentiq-net

  # ── Adminer (DB UI) ───────────────────────────────────────────
  adminer:
    image: adminer:4.8.1
    container_name: talentiq-adminer
    restart: unless-stopped
    depends_on:
      - mysql
    ports:
      - "8090:8080"
    networks:
      - talentiq-net

  # ── Redis Commander (Redis UI) ────────────────────────────────
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: talentiq-redis-commander
    restart: unless-stopped
    environment:
      REDIS_HOSTS: local:redis:6379
    ports:
      - "8091:8081"
    networks:
      - talentiq-net

# ── Networks ──────────────────────────────────────────────────
networks:
  talentiq-net:
    driver: bridge

# ── Volumes ───────────────────────────────────────────────────
volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local
  backend_uploads:
    driver: local
  backend_logs:
    driver: local
