# ============================================================
# TalentIQ — Docker Compose (Development)
# Services: backend, frontend, mysql, redis, adminer
# ============================================================

version: "3.9"

services:

  # ── MySQL ────────────────────────────────────────────────────
  mysql:
    image: mysql:8.4
    container_name: talentiq-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-HireMeAI}
      MYSQL_USER: ${MYSQL_USER:-talentiq_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    command: >
      mysqld
      --innodb-buffer-pool-size=256M
      --innodb-log-file-size=64M
      --innodb-flush-log-at-trx-commit=2
      --max-connections=200
      --slow-query-log=ON
      --long-query-time=1
      --slow-query-log-file=/var/log/mysql/slow-query.log
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - talentiq-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "--password=${MYSQL_ROOT_PASSWORD:-}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ── Redis ─────────────────────────────────────────────────────
  redis:
    image: redis:7.4-alpine
    container_name: talentiq-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    networks:
      - talentiq-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  # ── Zookeeper (for Kafka) ────────────────────────────────────
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: talentiq-zookeeper
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - talentiq-net

  # ── Kafka (Distributed Message Broker) ───────────────────────
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: talentiq-kafka
    restart: unless-stopped
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    ports:
      - "9093:9093"
    networks:
      - talentiq-net

  # ── Backend ───────────────────────────────────────────────────
  backend:
    image: abhaygupta002/talentiq-backend:latest
    build:
      context: ./backend/talentiq-backend
      dockerfile: Dockerfile
    container_name: talentiq-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      JAVA_OPTS: "-Xms128m -Xmx300m -XX:+TieredCompilation -XX:TieredStopAtLevel=1 -Djava.security.egd=file:/dev/./urandom"
      APP_PROFILE: dev
      DB_HOST: ${DB_HOST:-mysql}
      DB_PORT: ${DB_PORT:-3306}
      DB_NAME: ${DB_NAME:-HireMeAI}
      DB_USER: ${DB_USER:-talentiq_user}
      DB_PASSWORD: ${MYSQL_PASSWORD:-${DB_PASSWORD:-HireMeAiProject@2529}}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-in-production-minimum-256-bits}
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://localhost:5173
      FRONTEND_BASE_URL: http://localhost:3000
      STORAGE_PROVIDER: local
      STORAGE_LOCAL_PATH: /app/uploads
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      AI_PROVIDER: ${AI_PROVIDER:-openai}
      MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-hiremindai.ai@gmail.com}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-hiremindai.ai@gmail.com}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-HireMind AI Platform}
    ports:
      - "8081:8080"
    volumes:
      - backend_uploads:/app/uploads
      - backend_logs:/var/log/talentiq
    networks:
      - talentiq-net
    healthcheck:
      disable: true

  # ── Auth & Identity Microservice ──────────────────────────────
  auth-service:
    image: talentiq-auth:latest
    build:
      context: ./backend/talentiq-platform/services/auth-service
      dockerfile: Dockerfile
    container_name: talentiq-auth
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      JAVA_OPTS: "-XX:+TieredCompilation -XX:TieredStopAtLevel=1 -Xms64m -Xmx220m"
      SERVER_PORT: 8082
      DB_HOST: ${DB_HOST:-mysql}
      DB_PORT: ${DB_PORT:-3306}
      DB_NAME: ${DB_NAME:-HireMeAI}
      DB_USER: ${DB_USER:-talentiq_user}
      DB_PASSWORD: ${MYSQL_PASSWORD:-${DB_PASSWORD:-HireMeAiProject@2529}}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:-404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
      MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-hiremindai.ai@gmail.com}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
    ports:
      - "8082:8082"
    networks:
      - talentiq-net

  # ── Payment & Subscription Microservice ───────────────────────
  payment-service:
    image: talentiq-payment:latest
    build:
      context: ./backend/talentiq-platform/services/payment-service
      dockerfile: Dockerfile
    container_name: talentiq-payment
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      JAVA_OPTS: "-XX:+TieredCompilation -XX:TieredStopAtLevel=1 -Xms64m -Xmx220m"
      SERVER_PORT: 8087
      DB_HOST: ${DB_HOST:-mysql}
      DB_PORT: ${DB_PORT:-3306}
      DB_NAME: ${DB_NAME:-HireMeAI}
      DB_USER: ${DB_USER:-talentiq_user}
      DB_PASSWORD: ${MYSQL_PASSWORD:-${DB_PASSWORD:-HireMeAiProject@2529}}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      JWT_SECRET: ${JWT_SECRET:-404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://localhost:5173
      PAYMENT_GATEWAY_PROVIDER: mock
    ports:
      - "8087:8087"
    networks:
      - talentiq-net

  # ── Chat & Collaboration Microservice ─────────────────────────
  chat-service:
    image: talentiq-chat:latest
    build:
      context: ./backend/talentiq-platform/services/chat-service
      dockerfile: Dockerfile
    container_name: talentiq-chat
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_started
    environment:
      JAVA_OPTS: "-XX:+TieredCompilation -XX:TieredStopAtLevel=1 -Xms64m -Xmx220m"
      SERVER_PORT: 8086
      DB_HOST: ${DB_HOST:-mysql}
      DB_PORT: ${DB_PORT:-3306}
      DB_NAME: ${DB_NAME:-HireMeAI}
      DB_USER: ${DB_USER:-talentiq_user}
      DB_PASSWORD: ${MYSQL_PASSWORD:-${DB_PASSWORD:-HireMeAiProject@2529}}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      JWT_SECRET: ${JWT_SECRET:-404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://localhost:5173
    ports:
      - "8086:8086"
    networks:
      - talentiq-net

  # ── Job & AI Matching Microservice ───────────────────────────
  job-service:
    image: talentiq-job:latest
    build:
      context: ./backend/talentiq-platform/services/job-service
      dockerfile: Dockerfile
    container_name: talentiq-job
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_started
    environment:
      JAVA_OPTS: "-XX:+TieredCompilation -XX:TieredStopAtLevel=1 -Xms64m -Xmx220m"
      SERVER_PORT: 8085
      DB_HOST: ${DB_HOST:-mysql}
      DB_PORT: ${DB_PORT:-3306}
      DB_NAME: ${DB_NAME:-HireMeAI}
      DB_USER: ${DB_USER:-talentiq_user}
      DB_PASSWORD: ${MYSQL_PASSWORD:-${DB_PASSWORD:-HireMeAiProject@2529}}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      JWT_SECRET: ${JWT_SECRET:-404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://localhost:5173
    ports:
      - "8085:8085"
    networks:
      - talentiq-net

  # ── Candidate & Resume Microservice ──────────────────────────
  candidate-service:
    image: talentiq-candidate:latest
    build:
      context: ./backend/talentiq-platform/services/candidate-service
      dockerfile: Dockerfile
    container_name: talentiq-candidate
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_started
    environment:
      JAVA_OPTS: "-XX:+TieredCompilation -XX:TieredStopAtLevel=1 -Xms64m -Xmx220m"
      SERVER_PORT: 8083
      DB_HOST: ${DB_HOST:-mysql}
      DB_PORT: ${DB_PORT:-3306}
      DB_NAME: ${DB_NAME:-HireMeAI}
      DB_USER: ${DB_USER:-talentiq_user}
      DB_PASSWORD: ${MYSQL_PASSWORD:-${DB_PASSWORD:-HireMeAiProject@2529}}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      JWT_SECRET: ${JWT_SECRET:-404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://localhost:5173
      STORAGE_BASE_PATH: /app/uploads
    ports:
      - "8083:8083"
    volumes:
      - ./uploads:/app/uploads
    networks:
      - talentiq-net

  # ── Company & HR Microservice ────────────────────────────────
  company-service:
    image: talentiq-company:latest
    build:
      context: ./backend/talentiq-platform/services/company-service
      dockerfile: Dockerfile
    container_name: talentiq-company
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_started
    environment:
      JAVA_OPTS: "-XX:+TieredCompilation -XX:TieredStopAtLevel=1 -Xms64m -Xmx220m"
      SERVER_PORT: 8084
      DB_HOST: ${DB_HOST:-mysql}
      DB_PORT: ${DB_PORT:-3306}
      DB_NAME: ${DB_NAME:-HireMeAI}
      DB_USER: ${DB_USER:-talentiq_user}
      DB_PASSWORD: ${MYSQL_PASSWORD:-${DB_PASSWORD:-HireMeAiProject@2529}}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      JWT_SECRET: ${JWT_SECRET:-404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://localhost:5173
    ports:
      - "8084:8084"
    networks:
      - talentiq-net

  # ── Admin & Analytics Microservice ───────────────────────────
  admin-service:
    image: talentiq-admin:latest
    build:
      context: ./backend/talentiq-platform/services/admin-service
      dockerfile: Dockerfile
    container_name: talentiq-admin
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_started
    environment:
      JAVA_OPTS: "-XX:+TieredCompilation -XX:TieredStopAtLevel=1 -Xms64m -Xmx220m"
      SERVER_PORT: 8089
      DB_HOST: ${DB_HOST:-mysql}
      DB_PORT: ${DB_PORT:-3306}
      DB_NAME: ${DB_NAME:-HireMeAI}
      DB_USER: ${DB_USER:-talentiq_user}
      DB_PASSWORD: ${MYSQL_PASSWORD:-${DB_PASSWORD:-HireMeAiProject@2529}}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      JWT_SECRET: ${JWT_SECRET:-404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://localhost:5173
    ports:
      - "8089:8089"
    networks:
      - talentiq-net

  # ── API Gateway ───────────────────────────────────────────────
  api-gateway:
    image: talentiq-gateway:latest
    build:
      context: ./backend/talentiq-platform/services/api-gateway
      dockerfile: Dockerfile
    container_name: talentiq-gateway
    restart: unless-stopped
    depends_on:
      - backend
      - auth-service
      - payment-service
      - chat-service
      - job-service
      - candidate-service
      - company-service
      - admin-service
    environment:
      JAVA_OPTS: "-XX:+TieredCompilation -XX:TieredStopAtLevel=1 -Xms64m -Xmx200m"
      SERVER_PORT: 8080
      AUTH_SERVICE_URL: http://auth-service:8082
      PAYMENT_SERVICE_URL: http://payment-service:8087
      CHAT_SERVICE_URL: http://chat-service:8086
      CHAT_SERVICE_WS_URL: http://chat-service:8086
      JOB_SERVICE_URL: http://job-service:8085
      CANDIDATE_SERVICE_URL: http://candidate-service:8083
      COMPANY_SERVICE_URL: http://company-service:8084
      ADMIN_SERVICE_URL: http://admin-service:8089
      LEGACY_BACKEND_URL: http://backend:8080
      JWT_SECRET: ${JWT_SECRET:-404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://localhost:5173
    ports:
      - "8000:8080"
    networks:
      - talentiq-net
    healthcheck:
      disable: true

  # ── Frontend ──────────────────────────────────────────────────
  frontend:
    image: abhaygupta002/talentiq-frontend:latest
    build:
      context: ./talentiq-frontend
      dockerfile: Dockerfile
    container_name: talentiq-frontend
    restart: unless-stopped
    depends_on:
      - api-gateway
    environment:
      VITE_API_BASE_URL: http://backend:8080/api
      VITE_WS_URL: ws://backend:8080/api/ws
    ports:
      - "3000:80"
    networks:
      - talentiq-net

  # ── Adminer (DB UI) ───────────────────────────────────────────
  adminer:
    image: adminer:4.8.1
    container_name: talentiq-adminer
    restart: unless-stopped
    depends_on:
      - mysql
    ports:
      - "8090:8080"
    networks:
      - talentiq-net

  # ── Redis Commander (Redis UI) ────────────────────────────────
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: talentiq-redis-commander
    restart: unless-stopped
    environment:
      REDIS_HOSTS: local:redis:6379
    ports:
      - "8091:8081"
    networks:
      - talentiq-net

# ── Networks ──────────────────────────────────────────────────
networks:
  talentiq-net:
    driver: bridge

# ── Volumes ───────────────────────────────────────────────────
volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local
  backend_uploads:
    driver: local
  backend_logs:
    driver: local
