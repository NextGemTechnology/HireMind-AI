apiVersion: v1
kind: ConfigMap
metadata:
  name: hiremind-config
  namespace: hiremind-ai
data:
  SPRING_PROFILES_ACTIVE: "prod"
  DB_HOST: "mysql-service.hiremind-ai.svc.cluster.local"
  DB_PORT: "3306"
  DB_NAME: "HireMeAI"
  REDIS_HOST: "redis-service.hiremind-ai.svc.cluster.local"
  REDIS_PORT: "6379"
  MAIL_HOST: "smtp.gmail.com"
  MAIL_PORT: "587"
  MAIL_FROM: "hiremindai.ai@gmail.com"
  MAIL_FROM_NAME: "HireMind AI Platform"
  CORS_ALLOWED_ORIGINS: "https://hiremind.ai,http://localhost:3000"

---
apiVersion: v1
kind: Secret
metadata:
  name: hiremind-secrets
  namespace: hiremind-ai
type: Opaque
stringData:
  DB_USER: "talentiq_user"
  DB_PASSWORD: "YOUR_SECURE_MYSQL_PASSWORD_HERE"
  MAIL_USERNAME: "hiremindai.ai@gmail.com"
  MAIL_PASSWORD: "YOUR_16_CHAR_GOOGLE_APP_PASSWORD_HERE"
  JWT_SECRET: "YOUR_ULTRA_SECURE_256_BIT_JWT_SECRET_KEY_HERE"
